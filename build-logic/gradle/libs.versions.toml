[versions]
sdkVersion = "37"
room = "2.8.5"
coroutines = "1.11.0"
dagger = "2.60.1"
workManager = "2.12.0"
lifecycle = "2.11.0"
androidGradlePlugin = "9.5.0"
lint = "32.5.0" # androidGradlePlugin + 23
kotlin = "2.4.21"
ksp = "2.3.12" # with 2.3.13 build/generated/ksp/release disappears and compileReleaseKotlin can't find the Dagger components
compose = "1.12.1"
media3 = "1.11.1"
detekt = "1.23.8"
spotless = "8.10.4"
cameraX = "1.6.2"
kotlinDL = "0.5.2"
benchmark = "1.6.0-alpha01"
fragment = "1.9.1"
litert = "1.4.2" # 2.x drops the org.tensorflow.lite.support classes, the camera needs a migration to CompiledModel first

[libraries]
room = { module = "androidx.room:room-runtime", version.ref = "room" }
room-common = { module = "androidx.room:room-common", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-paging = { module = "androidx.room:room-paging", version.ref = "room" }

kotlin-dl-onnx = { module = "org.jetbrains.kotlinx:kotlin-deeplearning-onnx", version.ref = "kotlinDL" }
kotlin-dl-visualization = { module = "org.jetbrains.kotlinx:kotlin-deeplearning-visualization", version.ref = "kotlinDL" }
kotlin-dl-tensorflow = { module = "org.jetbrains.kotlinx:kotlin-deeplearning-tensorflow", version.ref = "kotlinDL" }
kotlin-dl-api = { module = "org.jetbrains.kotlinx:kotlin-deeplearning-api", version.ref = "kotlinDL" }

litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }
# NB: com.google.ai.edge.litert:litert-support:1.0.1 is an empty wrapper AAR (no classes) that only
# declares the `org.tensorflow.lite.support` namespace and pulls in litert-support-api. Depending on
# the wrapper makes the manifest merger fail with a duplicate-namespace error, so depend on
# litert-support-api directly — it carries the actual org.tensorflow.lite.support.* classes.
litert-support-api = { group = "com.google.ai.edge.litert", name = "litert-support-api", version.ref = "litert" }
litert-metadata = { group = "com.google.ai.edge.litert", name = "litert-metadata", version.ref = "litert" }

kotlin-power-assert = { module = "org.jetbrains.kotlin.plugin.power-assert:org.jetbrains.kotlin.plugin.power-assert.gradle.plugin", version.ref = "kotlin" }
spotlessPlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
detektPlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
detektApi = { module = "io.gitlab.arturbosch.detekt:detekt-api", version.ref = "detekt" }
detektCli = { module = "io.gitlab.arturbosch.detekt:detekt-cli", version.ref = "detekt" }
detektFormatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
detektTest = { module = "io.gitlab.arturbosch.detekt:detekt-test", version.ref = "detekt" }

camera = { module = "androidx.camera:camera-core", version.ref = "cameraX" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraX" }
camera-video = { module = "androidx.camera:camera-video", version.ref = "cameraX" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "cameraX" }
camera-ktx = { module = "androidx.camera:camera-extensions", version.ref = "cameraX" }
camera2 = { module = "androidx.camera:camera-camera2", version.ref = "cameraX" }

exoPlayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
exoPlayerHLS = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
exoPlayerUI = { module = "androidx.media3:media3-ui", version.ref = "media3" }
exoPlayerSession = { module = "androidx.media3:media3-session", version.ref = "media3" }

coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutinesAndroid = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" } # why

dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }
daggerAnnotation = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }

workManager = { module = "androidx.work:work-runtime-ktx", version.ref = "workManager" }
workManagerGCM = { module = "androidx.work:work-gcm", version.ref = "workManager" }

lifecycle-common = { module = "androidx.lifecycle:lifecycle-common", version.ref = "lifecycle" }
livedata = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" } # liveData (LiveData + coroutines)
viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" } # viewModelScope + savedStateHandle
lifecycleRuntime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" } # flowWithLifecycle

fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" } # easy fragment transaction + by viewModels()
fragment-compose = { module = "androidx.fragment:fragment-compose", version.ref = "fragment" }
activity = "androidx.activity:activity:1.13.0" # onBackPress support for Fragment
composeActivity = "androidx.activity:activity-compose:1.13.0"

lintApi = { module = "com.android.tools.lint:lint-api", version.ref = "lint" }

androidGradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "androidGradlePlugin" }

kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinComposeCompilerPlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
kspGradlePlugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }

kotlin-reflection = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-Serialization-Plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
kotlinSerialization = "org.jetbrains.kotlinx:kotlinx-serialization-json:1.12.0"
kover = "org.jetbrains.kotlinx:kover-gradle-plugin:0.9.11"
composeViewModel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
composeCoil = "io.coil-kt:coil-compose:2.7.0"
composeLifecycle = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
composeFoundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
composeLivedata = { module = "androidx.compose.runtime:runtime-livedata", version.ref = "compose" }
composeMaterial = { module = "androidx.compose.material:material", version.ref = "compose" }
composeAnimation = { module = "androidx.compose.animation:animation", version.ref = "compose" }
composeTooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
composeUITest = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose" }
composePaging = "androidx.paging:paging-compose:3.5.3"
# material-icons stopped at 1.7.8, it no longer follows the compose version
composeMaterialIcons = "androidx.compose.material:material-icons-core:1.7.8"
composeMaterialIconsExtended = "androidx.compose.material:material-icons-extended:1.7.8"

androidStartup = "androidx.startup:startup-runtime:1.2.0"
palette = "androidx.palette:palette:1.1.0"
exif = "androidx.exifinterface:exifinterface:1.4.2"
metrics = "androidx.metrics:metrics-performance:1.0.0"
preference = "androidx.preference:preference:1.2.1"
preferenceKtx = "androidx.preference:preference-ktx:1.2.1"
appCompat = "androidx.appcompat:appcompat:1.8.0"
dataStorePref = "androidx.datastore:datastore-preferences:1.3.0"
recyclerView = "androidx.recyclerview:recyclerview:1.4.0"
ticker = "com.robinhood.ticker:ticker:2.0.4"
retrofit = "com.squareup.retrofit2:retrofit:3.0.0"
retrofitSerialization = "com.squareup.retrofit2:converter-kotlinx-serialization:3.0.0"
retrofitInterceptor = "com.squareup.okhttp3:logging-interceptor:5.5.1"
retrofitScalars = "com.squareup.retrofit2:converter-scalars:3.0.0"
paging3 = "androidx.paging:paging-runtime:3.5.3"
material = "com.google.android.material:material:1.14.0"
constraintLayout = "androidx.constraintlayout:constraintlayout:2.2.2"
coil = "io.coil-kt:coil:2.7.0"
jsoup = "org.jsoup:jsoup:1.23.2" # Jsoup для разбора html
playCoreKtx = "com.google.android.play:app-update-ktx:2.1.0" # auto update + rateMe
playReview = "com.google.android.play:review-ktx:2.0.2"
webkit = "androidx.webkit:webkit:1.18.0"
coreKtx = "androidx.core:core-ktx:1.19.1" # Write more concise, idiomatic Kotlin code.
jsonSimple = "com.googlecode.json-simple:json-simple:1.1.1"
springAnimation = "androidx.dynamicanimation:dynamicanimation:1.1.0"
springAnimationKtx = "androidx.dynamicanimation:dynamicanimation-ktx:1.1.0"
instantApps = "com.google.android.gms:play-services-instantapps:18.2.0"
viewPager2 = "androidx.viewpager2:viewpager2:1.1.0"
splashScreen = "androidx.core:core-splashscreen:1.2.0"
performance = "androidx.core:core-performance:1.0.0"
performancePlayServices = "androidx.core:core-performance-play-services:1.0.0"

test-lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-testing", version.ref = "lifecycle" }
test-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
test-coroutines-debug = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-debug", version.ref = "coroutines" }
test-core = "androidx.test:core-ktx:1.7.0"
test-runner = "androidx.test:runner:1.7.0" # AndroidJUnitRunner
test-rules = "androidx.test:rules:1.7.0" # JUnit Rules
test-junit = "junit:junit:4.13.2" # Assertions and JUnit 4 framework
test-junit-kotlin = "androidx.test.ext:junit-ktx:1.3.0" # Assertions
test-truth = "androidx.test.ext:truth:1.7.0"
test-truth-jvm = "com.google.truth:truth:1.4.5"
test-core-tesing = "androidx.arch.core:core-testing:2.2.0"
test-fragment = { module = "androidx.fragment:fragment-testing", version.ref = "fragment" }
test-mockk = "io.mockk:mockk-android:1.14.11"
test-robolectric = "org.robolectric:robolectric:4.17"
test-espresso = "androidx.test.espresso:espresso-core:3.7.0"
test-espresso-intents = "androidx.test.espresso:espresso-intents:3.7.0"
test-uiautomator = "androidx.test.uiautomator:uiautomator:2.4.0"

benchmarkMacro = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
benchmarkJunit = { module = "androidx.benchmark:benchmark-junit4", version.ref = "benchmark" }

[bundles]
compose = ["composeAnimation", "composeMaterial", "composeMaterialIcons", "composeFoundation", "composeTooling", "composeCoil", "composeLivedata", "composeActivity", "composeLifecycle"]
camera = ["camera", "camera-lifecycle", "camera-video", "camera-view", "camera-ktx", "camera2"]
kotlinDL = ["kotlin-dl-onnx", "kotlin-dl-visualization", "kotlin-dl-tensorflow"]

[plugins]
benchmark = { id = "androidx.benchmark", version.ref = "benchmark" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
